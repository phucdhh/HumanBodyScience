<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Vòng Phản Hồi Âm Điều Khiển Hormone Giáp
  </text>
  
  <!-- Hypothalamus -->
  <rect x="300" y="80" width="200" height="80" rx="10" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Giấu vị (Hypothalamus)
  </text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
    Trung tâm điều khiển
  </text>
  
  <!-- Pituitary Gland -->
  <rect x="300" y="220" width="200" height="80" rx="10" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Tuyến yên (Pituitary)
  </text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
    Tuyến điều khiển
  </text>
  
  <!-- Thyroid Gland -->
  <rect x="300" y="360" width="200" height="80" rx="10" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Tuyến giáp (Thyroid)
  </text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#555">
    Tuyến mục tiêu
  </text>
  
  <!-- Target Tissues -->
  <rect x="300" y="500" width="200" height="60" rx="10" fill="#98D8C8" stroke="#333" stroke-width="2"/>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Các mô đích
  </text>
  
  <!-- Arrows: TRH from Hypothalamus to Pituitary -->
  <line x1="400" y1="160" x2="400" y2="220" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="420" y="195" font-family="Arial, sans-serif" font-size="14" fill="#0077BE" font-weight="bold">
    TRH
  </text>
  
  <!-- Arrows: TSH from Pituitary to Thyroid -->
  <line x1="400" y1="300" x2="400" y2="360" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="420" y="335" font-family="Arial, sans-serif" font-size="14" fill="#0077BE" font-weight="bold">
    TSH
  </text>
  
  <!-- Arrows: T3/T4 from Thyroid to Target Tissues -->
  <line x1="400" y1="440" x2="400" y2="500" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="420" y="475" font-family="Arial, sans-serif" font-size="14" fill="#0077BE" font-weight="bold">
    T3, T4
  </text>
  
  <!-- Negative Feedback Arrows -->
  <!-- From T3/T4 back to Pituitary -->
  <path d="M 300 530 Q 150 530 150 260 Q 150 260 300 260" fill="none" stroke="#FF0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="160" y="400" font-family="Arial, sans-serif" font-size="12" fill="#FF0000" font-weight="bold">
    Phản hồi âm
  </text>
  
  <!-- From T3/T4 back to Hypothalamus -->
  <path d="M 300 520 Q 120 520 120 120 Q 120 120 300 120" fill="none" stroke="#FF0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF0000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="550" y="80" width="220" height="150" rx="5" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="660" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Chú thích
  </text>
  
  <line x1="570" y1="125" x2="620" y2="125" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="630" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Kích thích sản xuất
  </text>
  
  <line x1="570" y1="155" x2="620" y2="155" stroke="#FF0000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  <text x="630" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Phản hồi âm (giảm)
  </text>
  
  <text x="570" y="190" font-family="Arial, sans-serif" font-size="12" fill="#0077BE" font-weight="bold">
    TRH:
  </text>
  <text x="610" y="190" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Thyrotropin-releasing hormone
  </text>
  
  <text x="570" y="210" font-family="Arial, sans-serif" font-size="12" fill="#0077BE" font-weight="bold">
    TSH:
  </text>
  <text x="610" y="210" font-family="Arial, sans-serif" font-size="12" fill="#333">
    Thyroid-stimulating hormone
  </text>
</svg>