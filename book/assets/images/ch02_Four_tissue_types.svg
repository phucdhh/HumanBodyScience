<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">
    Bốn Loại Mô Cơ Bản Trong Cơ Thể
  </text>
  
  <!-- Grid layout for 4 tissue types -->
  
  <!-- 1. Mô biểu bì - Top Left -->
  <rect x="50" y="70" width="340" height="180" rx="10" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="220" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    1. Mô biểu bì
  </text>
  
  <!-- Simple epithelium representation -->
  <rect x="70" y="115" width="100" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="120" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Đơn tầng
  </text>
  
  <!-- Stratified epithelium representation -->
  <rect x="70" y="165" width="100" height="60" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="185" x2="170" y2="185" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="205" x2="170" y2="205" stroke="#333" stroke-width="1"/>
  <text x="120" y="230" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Đa tầng
  </text>
  
  <!-- Functions -->
  <text x="190" y="130" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Bảo vệ cơ thể
  </text>
  <text x="190" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Phủ bề mặt
  </text>
  <text x="190" y="170" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Trao đổi chất
  </text>
  <text x="190" y="190" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Lót khoang bên trong
  </text>
  <text x="190" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Ví dụ: da, ruột
  </text>
  
  <!-- 2. Mô liên kết - Top Right -->
  <rect x="410" y="70" width="340" height="180" rx="10" fill="#98D8C8" stroke="#333" stroke-width="2"/>
  <text x="580" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    2. Mô liên kết
  </text>
  
  <!-- Connective tissue representation -->
  <circle cx="480" cy="150" r="8" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <circle cx="500" cy="170" r="8" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <circle cx="460" cy="180" r="8" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <circle cx="520" cy="140" r="8" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <circle cx="490" cy="200" r="8" fill="#ffffff" stroke="#333" stroke-width="1"/>
  
  <!-- Extracellular matrix -->
  <rect x="440" y="130" width="100" height="80" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="490" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Chất nền ngoại bào
  </text>
  
  <!-- Functions -->
  <text x="560" y="130" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Kết nối các cấu trúc
  </text>
  <text x="560" y="150" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Dự trữ năng lượng
  </text>
  <text x="560" y="170" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Vận chuyển chất
  </text>
  <text x="560" y="190" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Ví dụ: xương, máu
  </text>
  <text x="560" y="210" font-family="Arial, sans-serif" font-size="11" fill="#333">
    , gân, mô mỡ
  </text>
  
  <!-- 3. Mô cơ - Bottom Left -->
  <rect x="50" y="270" width="340" height="180" rx="10" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <text x="220" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    3. Mô cơ
  </text>
  
  <!-- Muscle representation -->
  <rect x="70" y="320" width="80" height="30" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="335" x2="150" y2="335" stroke="#333" stroke-width="1"/>
  <text x="110" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Cơ vân
  </text>
  
  <rect x="70" y="380" width="80" height="30" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="110" y="425" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Cơ trơn
  </text>
  
  <!-- Functions -->
  <text x="170" y="325" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Co rút tạo lực
  </text>
  <text x="170" y="345" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Vận động cơ thể
  </text>
  <text x="170" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Bơm máu (tim)
  </text>
  <text x="170" y="385" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Tiêu hóa (ruột)
  </text>
  <text x="170" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Loại: vân, trơn, tim
  </text>
  
  <!-- 4. Mô thần kinh - Bottom Right -->
  <rect x="410" y="270" width="340" height="180" rx="10" fill="#DDA0DD" stroke="#333" stroke-width="2"/>
  <text x="580" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    4. Mô thần kinh
  </text>
  
  <!-- Neuron representation -->
  <circle cx="480" cy="350" r="15" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="480" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Nơ-ron
  </text>
  
  <!-- Dendrites -->
  <line x1="465" y1="340" x2="450" y2="330" stroke="#333" stroke-width="1"/>
  <line x1="495" y1="340" x2="510" y2="330" stroke="#333" stroke-width="1"/>
  <line x1="465" y1="360" x2="450" y2="370" stroke="#333" stroke-width="1"/>
  <line x1="495" y1="360" x2="510" y2="370" stroke="#333" stroke-width="1"/>
  
  <!-- Axon -->
  <line x1="495" y1="350" x2="530" y2="350" stroke="#333" stroke-width="1"/>
  <circle cx="535" cy="350" r="5" fill="#ffffff" stroke="#333" stroke-width="1"/>
  
  <!-- Functions -->
  <text x="560" y="325" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Dẫn truyền tín hiệu
  </text>
  <text x="560" y="345" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Xử lý thông tin
  </text>
  <text x="560" y="365" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Điều khiển cơ thể
  </text>
  <text x="560" y="385" font-family="Arial, sans-serif" font-size="11" fill="#333">
    • Ví dụ: não, dây
  </text>
  <text x="560" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">
    thần kinh
  </text>
  
  <!-- Bottom summary -->
  <rect x="50" y="470" width="700" height="25" rx="5" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="487" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    <tspan font-weight="bold">Tóm tắt:</tspan> Tế bào + Tế bào = Mô → Mô + Mô = Cơ quan → Cơ quan + Cơ quan = Hệ cơ quan
  </text>
</svg>