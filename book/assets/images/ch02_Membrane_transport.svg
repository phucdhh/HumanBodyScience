<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">
    Hoạt Động Vận Qua Màng Tế Bào
  </text>
  
  <!-- Cell membrane representation -->
  <rect x="50" y="80" width="700" height="20" fill="#E6E6FA" stroke="#333" stroke-width="2"/>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Màng tế bào
  </text>
  
  <!-- Labels for outside and inside -->
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Ngoài tế bào
  </text>
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    Trong tế bào
  </text>
  
  <!-- 1. Passive transport - Left -->
  <rect x="50" y="150" width="220" height="150" rx="10" fill="#E8F5E9" stroke="#333" stroke-width="2"/>
  <text x="160" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    1. Vận chuyển thụ động
  </text>
  
  <!-- Membrane section -->
  <rect x="70" y="195" width="180" height="15" fill="#E6E6FA" stroke="#333" stroke-width="1"/>
  
  <!-- Particles moving passively -->
  <circle cx="90" cy="180" r="6" fill="#4CAF50"/>
  <circle cx="110" cy="185" r="6" fill="#4CAF50"/>
  <circle cx="130" cy="175" r="6" fill="#4CAF50"/>
  
  <circle cx="90" cy="225" r="6" fill="#4CAF50"/>
  <circle cx="110" cy="230" r="6" fill="#4CAF50"/>
  <circle cx="130" cy="220" r="6" fill="#4CAF50"/>
  
  <!-- Arrow -->
  <line x1="110" y1="210" x2="110" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <text x="160" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Nước, O₂, CO₂
  </text>
  <text x="160" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Không tốn năng lượng
  </text>
  <text x="160" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Theo chiều nồng độ
  </text>
  
  <!-- 2. Active transport - Center -->
  <rect x="290" y="150" width="220" height="150" rx="10" fill="#FFF3E0" stroke="#333" stroke-width="2"/>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    2. Vận chuyển chủ động
  </text>
  
  <!-- Membrane section -->
  <rect x="310" y="195" width="180" height="15" fill="#E6E6FA" stroke="#333" stroke-width="1"/>
  
  <!-- Protein pump -->
  <rect x="385" y="200" width="30" height="5" fill="#FF9800" stroke="#333" stroke-width="1"/>
  
  <!-- Particles being pumped -->
  <circle cx="380" cy="180" r="6" fill="#FF9800"/>
  <circle cx="420" cy="230" r="6" fill="#FF9800"/>
  
  <!-- ATP -->
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#FF9800">
    ATP
  </text>
  
  <!-- Arrow -->
  <line x1="390" y1="210" x2="410" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Bơm Na⁺, K⁺
  </text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Tốn năng lượng ATP
  </text>
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Ngược chiều nồng độ
  </text>
  
  <!-- 3. Signal transmission - Right -->
  <rect x="530" y="150" width="220" height="150" rx="10" fill="#E3F2FD" stroke="#333" stroke-width="2"/>
  <text x="640" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    3. Truyền tín hiệu
  </text>
  
  <!-- Membrane section -->
  <rect x="550" y="195" width="180" height="15" fill="#E6E6FA" stroke="#333" stroke-width="1"/>
  
  <!-- Receptor protein -->
  <rect x="625" y="190" width="20" height="20" fill="#2196F3" stroke="#333" stroke-width="1"/>
  
  <!-- Hormone signal -->
  <circle cx="635" cy="175" r="5" fill="#2196F3"/>
  <text x="635" y="168" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2196F3">
    Hormone
  </text>
  
  <!-- Internal signal -->
  <circle cx="635" cy="230" r="5" fill="#2196F3"/>
  <text x="635" y="245" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2196F3">
    Phản ứng
  </text>
  
  <!-- Arrow -->
  <line x1="635" y1="210" x2="635" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <text x="640" y="260" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Thụ thể hormone
  </text>
  <text x="640" y="280" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Kích hoạt phản ứng
  </text>
  <text x="640" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    • Như ăng-ten thu tin
  </text>
  
  <!-- Bottom comparison -->
  <rect x="50" y="320" width="700" height="150" rx="10" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    So Sánh Ba Loại Vận Chuyển
  </text>
  
  <!-- Comparison table -->
  <text x="100" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Loại
  </text>
  <text x="250" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Năng lượng
  </text>
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Chiều di chuyển
  </text>
  <text x="550" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">
    Ví dụ
  </text>
  
  <line x1="50" y1="385" x2="750" y2="385" stroke="#333" stroke-width="1"/>
  
  <text x="100" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Thụ động
  </text>
  <text x="250" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Không
  </text>
  <text x="400" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Cao → Thấp
  </text>
  <text x="550" y="405" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Nước, O₂
  </text>
  
  <text x="100" y="430" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Chủ động
  </text>
  <text x="250" y="430" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Có (ATP)
  </text>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Thấp → Cao
  </text>
  <text x="550" y="430" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Bơm Na⁺/K⁺
  </text>
  
  <text x="100" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Truyền tin
  </text>
  <text x="250" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Có (lượng nhỏ)
  </text>
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Không di chuyển
  </text>
  <text x="550" y="455" font-family="Arial, sans-serif" font-size="11" fill="#333">
    Thụ thể hormone
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>