  <title
     id="title2">Sankey diagram human circulatory system</title>
  <desc
     id="desc4">A Sankey diagram of the human circulatory system with approximate relative percentages of cardiac output delivered to major organ systems, drawn by CMG Lee based on data at http://www.vhlab.umn.edu/atlas/physiology-tutorial/cardiovascular-function.shtml .</desc>
