<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">
    Quá Trình Biệt Hóa Tế Bào
  </text>
  
  <!-- Stem cell (Hợp tử) -->
  <circle cx="400" cy="100" r="40" fill="#FFD700" stroke="#333" stroke-width="2"/>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Hợp tử
  </text>
  
  <!-- Arrows branching out -->
  <line x1="400" y1="140" x2="200" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="140" x2="400" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="140" x2="600" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Tissue types -->
  <!-- Epithelial -->
  <rect x="150" y="200" width="100" height="60" rx="10" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Mô biểu bì
  </text>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Da, ruột
  </text>
  
  <!-- Connective -->
  <rect x="350" y="200" width="100" height="60" rx="10" fill="#98D8C8" stroke="#333" stroke-width="2"/>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Mô liên kết
  </text>
  <text x="400" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Xương, máu
  </text>
  
  <!-- Muscle -->
  <rect x="550" y="200" width="100" height="60" rx="10" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <text x="600" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Mô cơ
  </text>
  <text x="600" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Cơ vân, tim
  </text>
  
  <!-- Nervous -->
  <rect x="350" y="300" width="100" height="60" rx="10" fill="#DDA0DD" stroke="#333" stroke-width="2"/>
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
    Mô thần kinh
  </text>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">
    Não, dây thần kinh
  </text>
  
  <!-- Arrow to nervous -->
  <line x1="400" y1="260" x2="400" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Specialized cells -->
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    → Tế bào da
  </text>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    → Tế bào ruột
  </text>
  
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    → Nơ-ron
  </text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    → Tế bào đệm
  </text>
  
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    → Tế bào cơ vân
  </text>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    → Tế bào cơ tim
  </text>
  
  <!-- Explanation box -->
  <rect x="50" y="420" width="700" height="60" rx="5" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    <tspan font-weight="bold">Giải thích:</tspan> Từ một tế bào ban đầu, thông qua quá trình "bật/tắt" gene,
  </text>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    các tế bào phát triển thành các loại chuyên biệt khác nhau như tế bào da, cơ, thần kinh...
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>